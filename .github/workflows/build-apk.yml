name: Build APK

on:
  push:
    branches: [build-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Static checks
        run: python3 tests/static_check.py

      - name: Assemble debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GameScreenVoice-0.1.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Result (APK or build log) is also pushed to branch build-apk-output.
      - name: Publish result to build-apk-output
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ 2>/dev/null || echo "no build.log" > /tmp/out/build.log
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/GameScreenVoice_0.1.2_debug.apk
            echo success > /tmp/out/STATUS
          else
            echo failed > /tmp/out/STATUS
          fi
          echo "${GITHUB_SHA}" > /tmp/out/SOURCE_COMMIT
          cd /tmp/out
          git init -q -b build-apk-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build result for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-apk-output
