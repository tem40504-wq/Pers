      - name: Verify music start and voice grammar
        run: |
          mkdir -p /tmp/vmc-tests
          javac -encoding UTF-8 -d /tmp/vmc-tests voice_media_app/app/src/main/java/com/voicemusic/control/VoiceCommands.java voice_media_app/app/src/main/java/com/voicemusic/control/CommandGate.java voice_media_app/app/src/main/java/com/voicemusic/control/SeekMath.java voice_media_app/TestCommands.java
          java -cp /tmp/vmc-tests TestCommands
          grep -q 'systemPlay' voice_media_app/app/src/main/java/com/voicemusic/control/MediaCommander.java
          grep -q 'START_MUSIC' voice_media_app/app/src/main/java/com/voicemusic/control/MediaCommander.java
      - name: Bundle Russian Vosk offline model
        run: |
          curl -fL --retry 3 --retry-delay 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru-extract
          mkdir -p voice_media_app/app/src/main/assets/vosk-ru
          cp -a /tmp/vosk-ru-extract/vosk-model-small-ru-0.22/. voice_media_app/app/src/main/assets/vosk-ru/
          echo 'voice_media_ru_0.22_v19' > voice_media_app/app/src/main/assets/vosk-ru/uuid
          test -s voice_media_app/app/src/main/assets/vosk-ru/am/final.mdl
      - name: Build installable Android APK
        run: gradle -p voice_media_app --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          APK=voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:'
          sha256sum "$APK"
      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" VoiceMediaControl-v1.9-PlayMusic-Fix.apk
          gh release create voicemedia-v1.9-play-fix VoiceMediaControl-v1.9-PlayMusic-Fix.apk --target voice-media-control-v1-9 --title 'Voice Media Control v1.9 - Start Music Fix' --notes 'Fixes Voice Включи музыку: resume paused MediaSession; remember last player; Android MEDIA_PLAY fallback when no session; preserve session on Выключи музыку by pausing; explicit music phrases work with wake-word protection. Video +10/-10/+30/-30 and previous controls remain. Offline Vosk; Android may restrict starting a fully closed app in background.'
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMediaControl-v1.9-PlayMusic-Fix-APK
          path: voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
