      - name: Run voice parser and stability tests
        run: |
          mkdir -p /tmp/vmc-testclasses
          javac -d /tmp/vmc-testclasses voice_music_app/app/src/main/java/com/voicemusic/control/VoiceCommands.java voice_music_app/app/src/main/java/com/voicemusic/control/CommandGate.java voice_music_app/TestCommands.java
          java -cp /tmp/vmc-testclasses TestCommands
          ! grep -qr 'BudsModeAccessibility\|com.samsung.android.app.watchmanager' voice_music_app/app/src/main
      - name: Bundle Vosk offline Russian model
        run: |
          curl -fL --retry 3 --retry-delay 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru-extract
          mkdir -p voice_music_app/app/src/main/assets/vosk-ru
          cp -a /tmp/vosk-ru-extract/vosk-model-small-ru-0.22/. voice_music_app/app/src/main/assets/vosk-ru/
          echo 'voice_music_ru_0.22_v16' > voice_music_app/app/src/main/assets/vosk-ru/uuid
          test -s voice_music_app/app/src/main/assets/vosk-ru/am/final.mdl
      - name: Assemble debug APK
        run: gradle -p voice_music_app --no-daemon :app:assembleDebug
      - name: Verify installable APK and signature
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:'
          sha256sum "$APK"
      - name: Publish standalone APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" VoiceMusicControl-v1.6-MusicOnly.apk
          gh release create voicemusic-v1.6-music-only VoiceMusicControl-v1.6-MusicOnly.apk --target voice-music-control-v1-6 --title 'Voice Music Control v1.6 - Music Only' --notes 'Removes all Galaxy Buds / Galaxy Wearable and accessibility settings, prioritizes Yandex Music playback, protects interim voice commands and preserves voice volume controls, STOP/PLAY and offline Russian Vosk engine. New app ID allows parallel installation.'
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusicControl-v1.6-MusicOnly-APK
          path: voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
