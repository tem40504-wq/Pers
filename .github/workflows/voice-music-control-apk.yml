      - name: Build signed debug APK
        run: |
          sed -i 's/button.setTextAllCaps(false);/button.setAllCaps(false);/' voice_music_app/app/src/main/java/com/voicemusic/control/MainActivity.java
          gradle -p voice_music_app --no-daemon :app:assembleDebug
      - name: Publish APK directly on isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          gh api -X PUT "repos/${{ github.repository }}/contents/downloads/VoiceMusicControl-v1.0.apk" \
            -f message='Build installable VoiceMusicControl APK' \
            -f branch=voice-music-control-apk \
            -f content="$(base64 -w0 "$APK")"
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusicControl-APK
          path: voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
