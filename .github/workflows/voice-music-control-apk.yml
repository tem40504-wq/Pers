      - name: Bundle offline Russian Vosk model
        run: |
          curl -fL --retry 3 --retry-delay 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru-extract
          mkdir -p voice_music_app/app/src/main/assets/vosk-ru
          cp -a /tmp/vosk-ru-extract/vosk-model-small-ru-0.22/. voice_music_app/app/src/main/assets/vosk-ru/
          echo 'voice_music_ru_0.22_v14' > voice_music_app/app/src/main/assets/vosk-ru/uuid
          test -s voice_music_app/app/src/main/assets/vosk-ru/am/final.mdl
      - name: Verify offline command support
        run: |
          grep -q 'STOP_MUSIC' voice_music_app/app/src/main/java/com/voicemusic/control/VoiceCommands.java
          grep -q 'headphoneStatus' voice_music_app/app/src/main/java/com/voicemusic/control/MediaCommander.java
      - name: Compile and sign Android APK
        run: gradle -p voice_music_app --no-daemon :app:assembleDebug
      - name: Verify signed APK
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - name: Publish v1.4 APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" VoiceMusicControl-v1.4-BudsStop.apk
          gh release create voicemusic-v1.4-buds-stop VoiceMusicControl-v1.4-BudsStop.apk --target voice-music-control-v1-4 --title 'Voice Music Control 1.4: Turn Music Off and Buds Status' --notes 'Voice commands: выключи музыку / отключи музыку / останови музыку. Sends STOP if supported and PAUSE otherwise. Galaxy Buds Bluetooth audio connection status and Bluetooth settings shortcut. Separate APK from v1.3.'
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusicControl-v1.4-BudsStop-APK
          path: voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
