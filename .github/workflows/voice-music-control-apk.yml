      - name: Verify offline voice grammar and preserved music commands
        run: |
          javac -d /tmp/vmc-tests voice_music_app/app/src/main/java/com/voicemusic/control/VoiceCommands.java voice_music_app/TestCommands.java voice_music_app/TestBudsCommands.java
          java -cp /tmp/vmc-tests TestBudsCommands
          java -cp /tmp/vmc-tests TestCommands
      - name: Bundle offline Russian Vosk model
        run: |
          curl -fL --retry 3 --retry-delay 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru-extract
          mkdir -p voice_music_app/app/src/main/assets/vosk-ru
          cp -a /tmp/vosk-ru-extract/vosk-model-small-ru-0.22/. voice_music_app/app/src/main/assets/vosk-ru/
          echo 'voice_music_ru_0.22_v15' > voice_music_app/app/src/main/assets/vosk-ru/uuid
          test -s voice_music_app/app/src/main/assets/vosk-ru/am/final.mdl
      - name: Compile and sign v1.5 APK
        run: gradle -p voice_music_app --no-daemon :app:assembleDebug
      - name: Verify APK signature
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" VoiceMusicControl-v1.5-BudsModes-TEST.apk
          gh release create voicemusic-v1.5-buds-modes-test VoiceMusicControl-v1.5-BudsModes-TEST.apk --target voice-music-control-v1-5 --title 'Voice Music Control v1.5 Galaxy Buds modes TEST' --notes 'Experimental opt-in Accessibility UI assistant. Commands for ANC, Ambient, Adaptive, Off, Voice Detect, Siren Detect, 360 Audio. No undocumented Bluetooth packets. Requires Samsung settings screen; check changes manually. Preserves offline Vosk playback commands and volume. Separate app installation.'
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusicControl-v1.5-BudsModes-TEST-APK
          path: voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
