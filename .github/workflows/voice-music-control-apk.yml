      - name: Bundle offline Russian Vosk model
        run: |
          curl -fL --retry 3 --retry-delay 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru-extract
          mkdir -p voice_music_app/app/src/main/assets/vosk-ru
          cp -a /tmp/vosk-ru-extract/vosk-model-small-ru-0.22/. voice_music_app/app/src/main/assets/vosk-ru/
          echo 'voice_music_ru_0.22_v13' > voice_music_app/app/src/main/assets/vosk-ru/uuid
          test -s voice_music_app/app/src/main/assets/vosk-ru/am/final.mdl
      - name: Compile and sign v1.3 installable APK
        run: gradle -p voice_music_app --no-daemon :app:assembleDebug
      - name: Publish v1.3 volume APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" VoiceMusicControl-v1.3-Volume.apk
          gh release create voicemusic-v1.3-volume VoiceMusicControl-v1.3-Volume.apk --target voice-music-control-v1-3 --title 'Voice Music Control v1.3: Volume 1-15' --notes 'Adds Russian commands Громкость 1-15, Громче, Тише using Android STREAM_MUSIC, retaining offline Vosk and v1.2 playback commands. Separate install to preserve v1.2. Stop the old listener before starting v1.3.'
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusicControl-v1.3-Volume-APK
          path: voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
