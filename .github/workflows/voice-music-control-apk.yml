      - name: Run parser and cold-start source tests
        run: |
          mkdir -p /tmp/vmc-tests
          javac -encoding UTF-8 -d /tmp/vmc-tests voice_media_app/app/src/main/java/com/voicemusic/control/VoiceCommands.java voice_media_app/app/src/main/java/com/voicemusic/control/CommandGate.java voice_media_app/app/src/main/java/com/voicemusic/control/SeekMath.java voice_media_app/TestCommands.java
          java -cp /tmp/vmc-tests TestCommands
          grep -q 'resolveColdMusicPackage' voice_media_app/app/src/main/java/com/voicemusic/control/MediaCommander.java
          grep -q 'ACTION_COLD_START' voice_media_app/app/src/main/java/com/voicemusic/control/MainActivity.java
          grep -q 'МУЗЫКА ПО УМОЛЧАНИЮ' voice_media_app/app/src/main/java/com/voicemusic/control/MainActivity.java
      - name: Bundle offline Russian Vosk model
        run: |
          curl -fL --retry 3 --retry-delay 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru-extract
          mkdir -p voice_media_app/app/src/main/assets/vosk-ru
          cp -a /tmp/vosk-ru-extract/vosk-model-small-ru-0.22/. voice_media_app/app/src/main/assets/vosk-ru/
          echo 'voice_media_ru_0.22_v191' > voice_media_app/app/src/main/assets/vosk-ru/uuid
          test -s voice_media_app/app/src/main/assets/vosk-ru/am/final.mdl
      - name: Compile signed Android APK
        run: gradle -p voice_media_app --no-daemon :app:assembleDebug
      - name: Verify APK signature and metadata
        run: |
          APK=voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:'
          sha256sum "$APK"
      - name: Publish standalone APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" VoiceMediaControl-v1.9.1-ColdStart.apk
          gh release create voicemedia-v1.9.1-cold-start VoiceMediaControl-v1.9.1-ColdStart.apk --target voice-media-control-v1-9-1 --title 'Voice Media Control v1.9.1 - Launch Music Cold Start' --notes 'Fix cold music start: installed music app selector, default Yandex Music, Android MediaBrowserService attempt, launch and retry Play from visible activity, actionable notification fallback when Android 14 blocks background activity launch. Playback, volume, video seek and offline Vosk retained. App ID v191 installs alongside v19.'
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMediaControl-v1.9.1-ColdStart-APK
          path: voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
