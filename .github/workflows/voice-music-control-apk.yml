      - name: Check universal commands and player independence
        run: |
          mkdir -p /tmp/vmc-testclasses
          javac -encoding UTF-8 -d /tmp/vmc-testclasses voice_media_app/app/src/main/java/com/voicemusic/control/VoiceCommands.java voice_media_app/app/src/main/java/com/voicemusic/control/CommandGate.java voice_media_app/app/src/main/java/com/voicemusic/control/SeekMath.java voice_media_app/TestCommands.java
          java -cp /tmp/vmc-testclasses TestCommands
          ! grep -R -Ei 'ru[.]yandex[.]music|BudsModeAccessibility' voice_media_app/app/src/main
      - name: Bundle local Russian Vosk model
        run: |
          curl -fL --retry 3 --retry-delay 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru-extract
          mkdir -p voice_media_app/app/src/main/assets/vosk-ru
          cp -a /tmp/vosk-ru-extract/vosk-model-small-ru-0.22/. voice_media_app/app/src/main/assets/vosk-ru/
          echo 'voice_media_ru_0.22_v17' > voice_media_app/app/src/main/assets/vosk-ru/uuid
          test -s voice_media_app/app/src/main/assets/vosk-ru/am/final.mdl
      - name: Build installable universal Android APK
        run: gradle -p voice_media_app --no-daemon :app:assembleDebug
      - name: Validate signed APK
        run: |
          APK=voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:'
          sha256sum "$APK"
      - name: Publish v1.7 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" VoiceMediaControl-v1.7-Universal.apk
          gh release create voicemedia-v1.7-universal VoiceMediaControl-v1.7-Universal.apk --target voice-media-control-v1-7 --title 'Voice Media Control 1.7 - Universal Music and Video' --notes 'Universal Android MediaSession controls with auto active-player switching, manual selection, video seek +10/-10/+30/-30, voice commands and offline Vosk model. Separate app package from previous versions. Features require each media app to expose Android MediaSession controls.'
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMediaControl-v1.7-Universal-APK
          path: voice_media_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
