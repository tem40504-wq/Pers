      - name: Bundle offline Russian speech recognition model
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 3 https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip -o /tmp/vosk-ru.zip
          unzip -q /tmp/vosk-ru.zip -d /tmp/vosk-ru-extract
          mkdir -p voice_music_app/app/src/main/assets/vosk-ru
          cp -a /tmp/vosk-ru-extract/vosk-model-small-ru-0.22/. voice_music_app/app/src/main/assets/vosk-ru/
          echo 'voice_music_ru_0.22_v1' > voice_music_app/app/src/main/assets/vosk-ru/uuid
          test -s voice_music_app/app/src/main/assets/vosk-ru/am/final.mdl
      - name: Compile and sign installable APK
        run: gradle -p voice_music_app --no-daemon :app:assembleDebug
      - name: Upload APK as GitHub release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          cp "$APK" VoiceMusicControl-v1.1-offline.apk
          gh release create voicemusic-v1.1-offline VoiceMusicControl-v1.1-offline.apk --target voice-music-control-apk --title 'Voice Music Control 1.1: Offline without interrupting music' --notes 'Offline Russian Vosk speech recognition with microphone recording and no request for audio focus. Independent package; can coexist with 1.0.'
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusicControl-v1.1-offline-APK
          path: voice_music_app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
