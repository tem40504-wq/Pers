name: Build DomaFit APK
on:
  push:
    branches:
      - domafit-apk-build-20261116
    paths-ignore:
      - DomaFit.apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      NODE_ENV: "production"
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Unpack source
        shell: bash
        run: |
          mkdir -p DomaFitApp
          base64 -d domafit-build/source.tar.xz.base64 | tar -xJ -C DomaFitApp
          test -f DomaFitApp/package.json
      - name: Install React Native and Expo
        working-directory: DomaFitApp
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
          npx expo prebuild --platform android --no-install
      - name: Compile release APK
        working-directory: DomaFitApp/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Validate APK
        shell: bash
        run: |
          cp DomaFitApp/android/app/build/outputs/apk/release/app-release.apk DomaFit.apk
          test -s DomaFit.apk
          unzip -t DomaFit.apk >/dev/null
          ls -lh DomaFit.apk
      - name: Store APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DomaFit-Android
          path: DomaFit.apk
          retention-days: 30
      - name: Publish APK on isolated branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DomaFit.apk
          git commit -m "Publish compiled DomaFit APK [skip ci]"
          git push origin HEAD:domafit-apk-build-20261116
