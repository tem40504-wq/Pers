name: Check installer script
on:
  push:
    branches: [build-apk]
    paths: ['tools/**', '.github/workflows/check-installer.yml']
jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\tools\INSTALL_TO_PHONE.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "ERR line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          Write-Host "PARSE OK"
      - name: Dry run without phone (expects 'no device' path, not a crash)
        shell: powershell
        run: |
          Copy-Item tools\INSTALL_TO_PHONE.ps1 $env:TEMP\i.ps1
          New-Item -ItemType File "$env:TEMP\GameScreenVoice_test.apk" -Force | Out-Null
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:TEMP\i.ps1" -PassThru -NoNewWindow -RedirectStandardOutput "$env:TEMP\o.txt"
          Start-Sleep 60; if (-not $p.HasExited) { $p.Kill() }
          Get-Content "$env:TEMP\o.txt"
