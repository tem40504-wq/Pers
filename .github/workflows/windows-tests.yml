name: Windows acceptance
on:
  workflow_dispatch:
  push:
    paths:
      - 'bootstrap/**'
      - 'pc_core/**'
      - 'tests_l9/**'
      - 'legacy_level8/**'
      - 'run_windows_tests.py'
      - 'optional_windows_smoke.py'
      - 'launch_agent.py'
      - 'main_pc_l9.py'
      - 'patch_main_pc_l9.py'
      - 'verify_adb.py'
      - 'VERIFY_ADB*.bat'
      - 'START_AGENT_PULL.bat'
      - 'start_agent.bat'
      - '.gitattributes'
      - '.github/workflows/windows-tests.yml'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
          architecture: 'x64'
      - name: Verify downloads, install pinned dependencies, run Windows tests
        run: python run_windows_tests.py --prepare --yes --optional-smoke
      - name: Print execution evidence
        if: always()
        shell: pwsh
        run: |
          Get-Content reports/windows_test_report.json -Encoding UTF8
          Get-Content reports/pytest.log -Encoding UTF8
          if (Test-Path reports/optional_runtime.log) { Get-Content reports/optional_runtime.log -Encoding UTF8 }
          if (Test-Path reports/windows_launcher.log) { Get-Content reports/windows_launcher.log -Encoding UTF8 }
      - name: Upload real Windows reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-test-reports
          path: reports/
